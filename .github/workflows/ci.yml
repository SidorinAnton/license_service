name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Отменяем предыдущие запуски
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd license_client && uv sync --dev
          cd ../license_server && uv sync --dev

      - name: Run Ruff linter
        run: make lint-check

  test-client:
    name: Test Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "license_client/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate RSA keys
        run: make keys

      - name: Install dependencies
        run: cd license_client && uv sync --dev

      - name: Run tests
        run: make test-client

  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "license_server/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate RSA keys
        run: make keys

      - name: Install dependencies
        run: cd license_server && uv sync --dev

      - name: Run tests
        run: make test-server

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [lint, test-server]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./license_server
          push: false
          load: true
          tags: license-server:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          