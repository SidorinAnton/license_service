name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Отменяем предыдущие запуски
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd license_client && uv sync --dev
          cd ../license_server && uv sync --dev

      - name: Run Ruff linter
        run: |
          cd license_client && uv run ruff check .
          cd ../license_server && uv run ruff check .

  test-client:
    name: Test Client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "license_client/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate RSA keys
        run: |
          mkdir -p license_server/config license_client/config
          openssl genrsa -out license_server/config/private_key.pem 2048
          openssl rsa -in license_server/config/private_key.pem -pubout -out license_client/config/public_key.pem

      - name: Install dependencies
        run: cd license_client && uv sync --dev

      - name: Run tests with coverage
        run: |
          cd license_client
          PYTHONPATH=. uv run pytest --cov=src --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-client-${{ matrix.os }}
          path: license_client/coverage.xml
          retention-days: 7

  test-server:
    name: Test Server (Docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Generate RSA keys & dummy .env
        run: |
          mkdir -p license_server/config license_client/config
          openssl genrsa -out license_server/config/private_key.pem 2048
          openssl rsa -in license_server/config/private_key.pem -pubout -out license_client/config/public_key.pem
          # Создаем пустой .env, чтобы docker-compose.dev.yaml не упал при отсутствии файла
          touch license_server/.env

      - name: Build and start Docker Compose
        run: |
          cd license_server
          docker compose -f docker-compose.dev.yaml up -d --build

      - name: Run tests inside Docker container
        run: |
          cd license_server
          docker compose -f docker-compose.dev.yaml exec -T app uv run pytest --cov=src --cov-report=xml --cov-report=term-missing -v

      - name: Copy coverage report from container
        if: always()
        run: |
          cd license_server
          docker compose -f docker-compose.dev.yaml cp app:/app/coverage.xml ./coverage.xml || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-server
          path: license_server/coverage.xml
          retention-days: 7

      - name: Down Docker Compose
        if: always()
        run: |
          cd license_server
          docker compose -f docker-compose.dev.yaml down -v
